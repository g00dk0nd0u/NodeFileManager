<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NodeFileManager</title>
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/canvas.css">
  </head>
  <body>
    <main id="workspace" aria-label="フォルダーワークスペース">
      <header class="toolbar">
        <h1>NodeFileManager</h1>
        <button id="select-folder" type="button">＋ Select Folder</button>
        <button id="refresh" type="button">↻ Refresh</button>
        <button id="rename" type="button">Rename</button>
        <span id="status" role="status">起動しています…</span>
      </header>
      <section id="canvas" tabindex="0">
        <svg id="edges" aria-hidden="true"><g></g></svg>
        <div id="world"></div>
        <p id="empty-hint">Select Folder からフォルダーを追加してください<br><small>ドラッグ: ノード移動　背景ドラッグ: パン　ホイール: ズーム</small></p>
      </section>
      <dialog id="folder-browser-dialog">
        <form method="dialog" id="folder-browser-form">
          <strong>Select Folder</strong>
          <div class="folder-browser-locations"></div>
          <div class="folder-browser-path"></div>
          <div class="folder-browser-folders"></div>
          <div class="dialog-actions">
            <button value="cancel">Cancel</button>
            <button id="folder-browser-confirm" value="confirm">Select This Folder</button>
          </div>
        </form>
      </dialog>
    </main>
    <script type="module" src="/js/app.js"></script>
  </body>
</html>
