name: Standalone test builds

on:
  workflow_dispatch:
  pull_request:
    paths: ["backend/**", "frontend/**", "scripts/**", "tests/**", "NodeFileManager.spec", "requirements-build.txt", ".github/workflows/standalone.yml"]

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            artifact: NodeFileManager-windows-x64
            executable: dist/NodeFileManager/NodeFileManager.exe
          - os: macos-15-intel
            artifact: NodeFileManager-macos-x64
            executable: dist/NodeFileManager.app/Contents/MacOS/NodeFileManager
    runs-on: ${{ matrix.os }}
    env:
      NODEFILEMANAGER_BUILD_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install -r requirements-build.txt
      - run: python -m unittest discover -s tests/backend
      - run: python scripts/build_standalone.py
      - name: Packaged health smoke test
        shell: bash
        run: |
          "${{ matrix.executable }}" --no-browser &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          python - <<'PY'
          import json, time, urllib.request
          for attempt in range(50):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:8000/api/health", timeout=1) as response:
                      health = json.load(response)
                  assert health["status"] == "ok"
                  assert health["app"] == "NodeFileManager"
                  assert health["packaged"] is True
                  request = urllib.request.Request("http://127.0.0.1:8000/api/application/quit", data=b"{}", headers={"Origin": "http://127.0.0.1:8000", "Content-Type": "application/json"})
                  urllib.request.urlopen(request, timeout=2).read()
                  break
              except OSError:
                  if attempt == 49: raise
                  time.sleep(.2)
          PY
          wait "$pid"
          trap - EXIT
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-${{ github.sha }}
          path: dist/${{ matrix.artifact }}.zip
          if-no-files-found: error
